<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiBaCa — Rumah Nanas 3D (Percubaan)</title><style>*{box-sizing:border-box}body{margin:0;background:#075477;font-family:Arial,sans-serif;overflow:hidden}#scene{position:fixed;inset:0}#scene canvas{display:block}#hud{position:fixed;top:15px;left:15px;background:#fffdeeea;padding:14px 18px;border:3px solid #fff;border-radius:18px;box-shadow:0 5px 0 #005f8b;max-width:350px}h1{font-size:21px;margin:0 0 5px;color:#0b779c}p{margin:4px 0;font-size:13px;font-weight:bold;color:#356479}#back{position:fixed;bottom:18px;right:18px;background:#ffd64c;color:#67420d;border:3px solid white;border-radius:14px;padding:12px;font-weight:900;cursor:pointer}#tip{position:fixed;bottom:18px;left:18px;color:white;background:#003f66bb;padding:10px 14px;border-radius:12px;font-weight:bold;font-size:13px}@media(max-width:650px){#hud{max-width:260px}#tip{bottom:76px}}#cinematicMenu{position:fixed;z-index:5;top:50%;right:clamp(12px,5vw,65px);transform:translateY(-50%);width:min(340px,42vw);padding:20px;background:#fff9e9ed;border:4px solid white;border-radius:26px;box-shadow:0 14px 0 #086c9a,0 25px 50px #002e5680;text-align:center}#cinematicMenu h2{margin:4px 0 0;color:#f7b925;font-size:clamp(25px,3vw,38px);text-shadow:1px 2px #8c650e}#cinematicMenu .subtitle{font-size:13px;font-weight:900;color:#167ca0;margin-bottom:14px}#cinematicMenu button{display:block;width:100%;margin:9px 0;padding:11px 7px;border:3px solid #fff;border-radius:13px;background:#ffcf48;box-shadow:0 4px #c99925;font-weight:900;color:#35576b;cursor:pointer}#cinematicMenu button:nth-of-type(2){background:#a9ecff;box-shadow:0 4px #6bb5ca}#cinematicMenu button:nth-of-type(3){background:#ffc0dd;box-shadow:0 4px #ce7ca1}#cinematicMenu button:nth-of-type(4){background:#c2e9a2;box-shadow:0 4px #84b762}#menuInfo{max-height:32vh;overflow:auto;text-align:left;font-size:13px;line-height:1.55;background:white;border-radius:12px;padding:12px;margin-top:12px;color:#315b70}#menuInfo[hidden]{display:none}#menuInfo ol{padding-left:20px}#menuInfo li{margin:7px 0}#hud{z-index:2;max-width:230px}#back{z-index:4}#tip{z-index:2}@media(max-width:700px){#cinematicMenu{top:auto;bottom:13px;left:12px;right:12px;transform:none;width:auto;padding:10px 14px;border-radius:19px}#cinematicMenu h2{font-size:23px}#cinematicMenu button{display:inline-block;width:48%;font-size:12px;margin:4px .5%;padding:9px 3px}#cinematicMenu .subtitle{margin-bottom:6px}#menuInfo{max-height:28vh}#hud{top:8px;left:8px;padding:8px;max-width:175px}#hud p{display:none}#hud h1{font-size:15px}#tip,#back{display:none}}</style></head><body><div id="scene"></div><section id="cinematicMenu" aria-label="Menu utama SiBaCa"><h2>🍍 SiBaCa</h2><div class="subtitle">Pengembaraan Membaca Bikini Bottom</div><button id="goPlay">▶️ MULA BERMAIN</button><button data-info="how">📖 CARA BERMAIN</button><button data-info="purpose">🎯 TUJUAN PEMBELAJARAN</button><button data-info="settings">⚙️ TETAPAN</button><div id="menuInfo" hidden></div></section><div id="hud"><h1>🍍 Rumah SpongeBob — 3D</h1><p>Pratonton ruang tamu 3D SiBaCa</p><p>🎬 Kamera bergerak secara sinematik.</p></div><div id="tip">🧽 Babak percubaan · Perabot 3D · Gary · SpongeBob</div><button id="back" onclick="location.href='index.html'">↩ Kembali ke SiBaCa</button><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#2c9bc2');
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(7,5.4,9);camera.lookAt(0,1.8,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc9faff,0x31769a,2.2));const sun=new THREE.DirectionalLight(0xfff0b0,2.5);sun.position.set(-3,8,4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,roughness=.85)=>new THREE.MeshStandardMaterial({color:c,roughness});
const M={floor:mat('#d9b477'),wall:mat('#f6c86e'),wood:mat('#98551f'),blue:mat('#167eaf'),navy:mat('#134567'),yellow:mat('#ffe224'),white:mat('#ffffff'),brown:mat('#a46b3c'),pink:mat('#f8a8cb'),green:mat('#7bc778'),red:mat('#e94c55'),black:mat('#28232e'),shell:mat('#fa9e63')};
function box(w,h,d,m,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function cyl(rt,rb,h,m,x,y,z,n=32){let o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function ball(r,m,x,y,z,sc=[1,1,1]){let o=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),m);o.position.set(x,y,z);o.scale.set(...sc);o.castShadow=true;scene.add(o);return o}
function ring(r,t,m,x,y,z){const o=new THREE.Mesh(new THREE.TorusGeometry(r,t,12,48),m);o.position.set(x,y,z);scene.add(o);return o}
// Ruang tamu dibina sebagai set 3D terbuka untuk pandangan kamera.
box(11,.22,8,M.floor,0,-.1,0);box(11,5,.18,M.wall,0,2.4,-4);box(.18,5,8,M.wall,-5.5,2.4,0);box(.18,5,8,M.wall,5.5,2.4,0);
for(let x=-5;x<=5;x+=1.4){box(.11,.08,8,mat('#c69247'),x,.04,0)}
// Tingkap bulat pada dinding belakang
for(const x of [-3.4,3.2]){let glass=ball(.68,mat('#56bde0'),x,3,-3.82,[1,1,.11]);ring(.73,.14,M.navy,x,3,-3.69);ball(.14,M.white,x-.25,3.22,-3.66,[1,.5,.15])}
// Pintu kayu bulat
box(1.65,2.9,.19,M.wood,.4,1.45,-3.83);ball(.16,M.yellow,1.05,1.5,-3.69);
// Sofa merah
box(3,.55,1.15,M.red,-2.3,.45,-1.1);box(3,1.15,.34,M.red,-2.3,1.1,-1.65);box(.32,.75,1.4,M.red,-3.9,.75,-1.1);box(.32,.75,1.4,M.red,-.7,.75,-1.1);
box(1.8,.15,1.15,M.wood,-1.5,.52,1.2);for(const x of [-2.15,-.85])for(const z of [.8,1.6])box(.12,.5,.12,M.wood,x,.24,z);
// TV antik
box(1.7,1.25,.3,M.brown,3,1.7,-3.55);box(1.3,.9,.07,M.navy,3,1.75,-3.34);box(1.07,.65,.04,mat('#69d6e9'),3,1.75,-3.28);box(.15,.45,.15,M.brown,3,2.56,-3.55);
// SpongeBob bentuk blok 3D
const sponge=new THREE.Group();scene.add(sponge);sponge.position.set(1.7,0,1.4);
function part(mesh){sponge.add(mesh);return mesh}
function pb(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);part(o);return o}
function ps(r,m,x,y,z,scale){const o=new THREE.Mesh(new THREE.SphereGeometry(r,18,12),m);o.position.set(x,y,z);if(scale)o.scale.set(...scale);part(o);return o}
pb(1.05,1.3,.45,M.yellow,0,1.65,0);pb(1.05,.27,.46,M.white,0,.86,0);pb(1.05,.31,.47,M.brown,0,.59,0);
for(const x of [-.27,.27]){ps(.23,M.white,x,1.9,.27);ps(.095,M.blue,x,1.91,.47);ps(.043,M.black,x,1.91,.55);pb(.14,.5,.16,M.yellow,x,.25,0);pb(.23,.17,.33,M.black,x,.07,.1)}
ps(.15,M.yellow,0,1.63,.35,[.8,.6,1.3]);pb(.4,.055,.05,M.brown,0,1.34,.25);
for(const x of [-.64,.64]){pb(.18,.5,.18,M.yellow,x,1.12,0);ps(.13,M.yellow,x,1.38,0)}
// Gary: cangkerang dan badan siput
ball(.44,M.pink,-3.65,.52,2.15,[1.3,.85,.65]);ball(.42,M.shell,-3.75,.67,2.15,[1,.95,.75]);ball(.27,M.green,-3.26,.34,2.15,[1.4,.5,.85]);
for(const z of [1.98,2.32]){cyl(.075,.075,.45,M.green,-3.05,.72,z);ball(.14,M.white,-3.05,.96,z);ball(.05,M.black,-2.95,.96,z)}
// Hiasan karang dan buih
for(const [x,z] of [[-4,3.2],[4.3,2.7],[-4.3,-2.8]]){cyl(.13,.25,.7,M.green,x,.35,z);ball(.3,M.green,x,.72,z,[.7,1.2,.7])}
const bubbles=[];for(let i=0;i<18;i++){const m=new THREE.MeshBasicMaterial({color:0xc8f9ff,transparent:true,opacity:.23,wireframe:true});const b=ball(.07+(i%4)*.04,m,-4.6+(i*1.71)%9,((i*0.43)%4),-2.8+(i*.93)%5);bubbles.push(b)}
// Babak sinematik: kamera bergerak sendiri; pemain hanya memilih menu.
const target=new THREE.Vector3(0,1.55,-.3);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const panels={
how:'<b>📖 CARA BERMAIN</b><p>Gerakkan SpongeBob dengan WASD atau anak panah. Hampiri ⭐, kemudian tekan E atau BERCAKAP. Lengkapkan lima misi untuk mengumpul bintang.</p><ol><li><b>Misi 1: Membaca Perkataan</b> — Rumah Patrick.</li><li><b>Misi 2: Membina dan Membaca Frasa</b> — Krusty Krab (simpulan bahasa).</li><li><b>Misi 3: Membaca Ayat</b> — Rumah Sandy.</li><li><b>Misi 4: Membaca Ayat dan Ujian Pemahaman</b> — Goo Lagoon.</li><li><b>Misi 5: Membaca Dialog dan Ujian Kefahaman</b> — Padang Obor-obor.</li></ol>',
purpose:'<b>🎯 TUJUAN PEMBELAJARAN</b><p>Permainan ini membantu murid meningkatkan kemahiran membaca Bahasa Melayu melalui aktiviti interaktif secara berperingkat.</p><p><b>Bidang:</b> 2.0 Kemahiran Membaca</p><p><b>SK 2.1:</b> Asas membaca dan memahami.</p><p><b>SP 2.1.1:</b> Membaca dan memahami petikan dengan sebutan yang betul dan intonasi yang sesuai.</p>',
settings:'<b>⚙️ TETAPAN</b><p>Gunakan kawalan kelantangan pada peranti. Dalam misi membaca, tekan Dengar Contoh untuk mendengar bacaan.</p>'
};
const info=document.getElementById('menuInfo');
document.querySelectorAll('[data-info]').forEach(b=>b.addEventListener('click',()=>{const key=b.dataset.info;if(!info.hidden&&info.dataset.key===key){info.hidden=true;return}info.innerHTML=panels[key];info.dataset.key=key;info.hidden=false}));
document.getElementById('goPlay').addEventListener('click',()=>{location.href='index.html'});
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();
sponge.position.y=Math.sin(t*2)*.045;sponge.rotation.y=Math.sin(t*.8)*.13;
bubbles.forEach((b,i)=>{b.position.y=(i*.41+t*(.15+i%3*.06))%4.5});
const yaw=.12+Math.sin(t*.16)*.24,pitch=.21+Math.sin(t*.13)*.025,dist=10.3+Math.sin(t*.19)*.5;
camera.position.set(target.x+dist*Math.sin(yaw)*Math.cos(pitch),target.y+dist*Math.sin(pitch),target.z+dist*Math.cos(yaw)*Math.cos(pitch));camera.lookAt(target);
renderer.render(scene,camera)}animate();
</script></body></html>
