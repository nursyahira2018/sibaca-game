<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiBaCa — Rumah Nanas 3D (Percubaan)</title><style>*{box-sizing:border-box}body{margin:0;background:#075477;font-family:Arial,sans-serif;overflow:hidden}#scene{position:fixed;inset:0}#scene canvas{display:block}#hud{position:fixed;top:15px;left:15px;background:#fffdeeea;padding:14px 18px;border:3px solid #fff;border-radius:18px;box-shadow:0 5px 0 #005f8b;max-width:350px}h1{font-size:21px;margin:0 0 5px;color:#0b779c}p{margin:4px 0;font-size:13px;font-weight:bold;color:#356479}#back{position:fixed;bottom:18px;right:18px;background:#ffd64c;color:#67420d;border:3px solid white;border-radius:14px;padding:12px;font-weight:900;cursor:pointer}#tip{position:fixed;bottom:18px;left:18px;color:white;background:#003f66bb;padding:10px 14px;border-radius:12px;font-weight:bold;font-size:13px}@media(max-width:650px){#hud{max-width:260px}#tip{bottom:76px}}</style></head><body><div id="scene"></div><div id="hud"><h1>🍍 Rumah SpongeBob — 3D</h1><p>Pratonton ruang tamu 3D SiBaCa</p><p>🖱️ Seret untuk melihat dari sudut lain. Skrol untuk zum.</p></div><div id="tip">🧽 Babak percubaan · Perabot 3D · Gary · SpongeBob</div><button id="back" onclick="location.href='index.html'">↩ Kembali ke SiBaCa</button><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#2c9bc2');
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(7,5.4,9);camera.lookAt(0,1.8,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc9faff,0x31769a,2.2));const sun=new THREE.DirectionalLight(0xfff0b0,2.5);sun.position.set(-3,8,4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,roughness=.85)=>new THREE.MeshStandardMaterial({color:c,roughness});
const M={floor:mat('#d9b477'),wall:mat('#f6c86e'),wood:mat('#98551f'),blue:mat('#167eaf'),navy:mat('#134567'),yellow:mat('#ffe224'),white:mat('#ffffff'),brown:mat('#a46b3c'),pink:mat('#f8a8cb'),green:mat('#7bc778'),red:mat('#e94c55'),black:mat('#28232e'),shell:mat('#fa9e63')};
function box(w,h,d,m,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function cyl(rt,rb,h,m,x,y,z,n=32){let o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function ball(r,m,x,y,z,sc=[1,1,1]){let o=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),m);o.position.set(x,y,z);o.scale.set(...sc);o.castShadow=true;scene.add(o);return o}
function ring(r,t,m,x,y,z){const o=new THREE.Mesh(new THREE.TorusGeometry(r,t,12,48),m);o.position.set(x,y,z);scene.add(o);return o}
// Ruang tamu dibina sebagai set 3D terbuka untuk pandangan kamera.
box(11,.22,8,M.floor,0,-.1,0);box(11,5,.18,M.wall,0,2.4,-4);box(.18,5,8,M.wall,-5.5,2.4,0);box(.18,5,8,M.wall,5.5,2.4,0);
for(let x=-5;x<=5;x+=1.4){box(.11,.08,8,mat('#c69247'),x,.04,0)}
// Tingkap bulat pada dinding belakang
for(const x of [-3.4,3.2]){let glass=ball(.68,mat('#56bde0'),x,3,-3.82,[1,1,.11]);ring(.73,.14,M.navy,x,3,-3.69);ball(.14,M.white,x-.25,3.22,-3.66,[1,.5,.15])}
// Pintu kayu bulat
box(1.65,2.9,.19,M.wood,.4,1.45,-3.83);ball(.16,M.yellow,1.05,1.5,-3.69);
// Sofa merah
box(3,.55,1.15,M.red,-2.3,.45,-1.1);box(3,1.15,.34,M.red,-2.3,1.1,-1.65);box(.32,.75,1.4,M.red,-3.9,.75,-1.1);box(.32,.75,1.4,M.red,-.7,.75,-1.1);
box(1.8,.15,1.15,M.wood,-1.5,.52,1.2);for(const x of [-2.15,-.85])for(const z of [.8,1.6])box(.12,.5,.12,M.wood,x,.24,z);
// TV antik
box(1.7,1.25,.3,M.brown,3,1.7,-3.55);box(1.3,.9,.07,M.navy,3,1.75,-3.34);box(1.07,.65,.04,mat('#69d6e9'),3,1.75,-3.28);box(.15,.45,.15,M.brown,3,2.56,-3.55);
// SpongeBob bentuk blok 3D
const sponge=new THREE.Group();scene.add(sponge);sponge.position.set(1.7,0,1.4);
function part(mesh){sponge.add(mesh);return mesh}
function pb(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);part(o);return o}
function ps(r,m,x,y,z,scale){const o=new THREE.Mesh(new THREE.SphereGeometry(r,18,12),m);o.position.set(x,y,z);if(scale)o.scale.set(...scale);part(o);return o}
pb(1.05,1.3,.45,M.yellow,0,1.65,0);pb(1.05,.27,.46,M.white,0,.86,0);pb(1.05,.31,.47,M.brown,0,.59,0);
for(const x of [-.27,.27]){ps(.23,M.white,x,1.9,.27);ps(.095,M.blue,x,1.91,.47);ps(.043,M.black,x,1.91,.55);pb(.14,.5,.16,M.yellow,x,.25,0);pb(.23,.17,.33,M.black,x,.07,.1)}
ps(.15,M.yellow,0,1.63,.35,[.8,.6,1.3]);pb(.4,.055,.05,M.brown,0,1.34,.25);
for(const x of [-.64,.64]){pb(.18,.5,.18,M.yellow,x,1.12,0);ps(.13,M.yellow,x,1.38,0)}
// Gary: cangkerang dan badan siput
ball(.44,M.pink,-3.65,.52,2.15,[1.3,.85,.65]);ball(.42,M.shell,-3.75,.67,2.15,[1,.95,.75]);ball(.27,M.green,-3.26,.34,2.15,[1.4,.5,.85]);
for(const z of [1.98,2.32]){cyl(.075,.075,.45,M.green,-3.05,.72,z);ball(.14,M.white,-3.05,.96,z);ball(.05,M.black,-2.95,.96,z)}
// Hiasan karang dan buih
for(const [x,z] of [[-4,3.2],[4.3,2.7],[-4.3,-2.8]]){cyl(.13,.25,.7,M.green,x,.35,z);ball(.3,M.green,x,.72,z,[.7,1.2,.7])}
const bubbles=[];for(let i=0;i<18;i++){const m=new THREE.MeshBasicMaterial({color:0xc8f9ff,transparent:true,opacity:.23,wireframe:true});const b=ball(.07+(i%4)*.04,m,-4.6+(i*1.71)%9,((i*0.43)%4),-2.8+(i*.93)%5);bubbles.push(b)}
// Kamera boleh dipusing dengan tetikus atau sentuhan.
let yaw=.63,pitch=.34,dist=11,drag=false,px=0,py=0;const target=new THREE.Vector3(0,1.5,-.3);
function updateCamera(){camera.position.set(target.x+dist*Math.sin(yaw)*Math.cos(pitch),target.y+dist*Math.sin(pitch),target.z+dist*Math.cos(yaw)*Math.cos(pitch));camera.lookAt(target)}
updateCamera();
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointerup',()=>drag=false);
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-px)*.005;pitch=Math.max(.1,Math.min(.85,pitch+(e.clientY-py)*.004));px=e.clientX;py=e.clientY;updateCamera()});
renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(7,Math.min(17,dist+e.deltaY*.01));updateCamera()},{passive:true});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();sponge.position.y=Math.sin(t*2)*.045;sponge.rotation.y=Math.sin(t*.8)*.1;bubbles.forEach((b,i)=>{b.position.y=(i*.41+t*(.15+i%3*.06))%4.5});renderer.render(scene,camera)}animate();
</script></body></html>
