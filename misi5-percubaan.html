{"id":"pink","color":"#f282be","label":"Merah jambu","level":"Pendek dan mudah","title":"Persediaan Jamuan","cast":{"Ali":"Budak lelaki","Ibu":"Ibu Ali"},"dialog":[["Ali","Ibu, kita hendak buat apa?"],["Ibu","Kita hendak menyediakan jamuan."],["Ali","Bolehkah saya membantu ibu?"],["Ibu","Boleh. Tolong susun pinggan di atas meja."],["Ali","Baik, ibu. Saya susun sekarang."],["Ibu","Terima kasih, Ali. Kamu memang ringan tulang."]],"idioms":[["ringan tulang","Rajin membantu."]],"questions":[{"q":"Siapakah yang mahu membantu ibunya?","options":["Farid","Ali","Amir"],"answer":1,"explain":"Ali menawarkan diri untuk membantu ibunya."},{"q":"Apakah yang diminta oleh ibu?","options":["Menyusun pinggan","Membeli buah-buahan","Menanam bunga"],"answer":0,"explain":"Ibu meminta Ali menyusun pinggan di atas meja."},{"q":"Apakah maksud ringan tulang?","options":["Suka bermain","Mudah berasa letih","Rajin membantu"],"answer":2,"explain":"Ringan tulang bermaksud rajin membantu."},{"q":"Jika ibu sedang menyediakan jamuan, apakah yang patut kamu lakukan?","options":["Membiarkan ibu membuat semuanya","Menawarkan bantuan kepada ibu","Menyembunyikan pinggan"],"answer":1,"explain":"Menawarkan bantuan dapat meringankan tugas ibu."}]},
{"id":"blue","color":"#67c5ff","label":"Biru","level":"Sederhana panjang","title":"Menziarahi Jiran","cast":{"Aina":"Budak perempuan","Ibu":"Ibu Aina"},"dialog":[["Aina","Ibu, mengapa kita hendak ke rumah Mak Cik Salmah?"],["Ibu","Mak Cik Salmah kurang sihat. Kita hendak menziarahinya."],["Aina","Bolehkah saya membawa buah-buahan ini sebagai buah tangan?"],["Ibu","Boleh, Aina. Mari kita masukkan ke dalam bakul."],["Aina","Ibu, siapa yang akan menyediakan makanan untuknya?"],["Ibu","Ibu sudah memasak bubur. Kita boleh membawanya sekali."],["Aina","Tentu Mak Cik Salmah gembira apabila kita datang."],["Ibu","Betul. Kita perlu ambil berat tentang jiran yang sakit."]],"idioms":[["buah tangan","Hadiah yang dibawa ketika melawat seseorang."],["ambil berat","Memberikan perhatian dan mengambil peduli."]],"questions":[{"q":"Mengapakah Aina dan ibu hendak menziarahi Mak Cik Salmah?","options":["Mak Cik Salmah kurang sihat","Mak Cik Salmah mengadakan jamuan","Mak Cik Salmah hendak bermain"],"answer":0,"explain":"Mereka mahu menziarahi Mak Cik Salmah yang kurang sihat."},{"q":"Apakah makanan yang sudah dimasak oleh ibu?","options":["Rendang","Nasi impit","Bubur"],"answer":2,"explain":"Ibu sudah memasak bubur untuk dibawa bersama-sama."},{"q":"Apakah maksud buah tangan dalam dialog ini?","options":["Buah yang belum masak","Hadiah yang dibawa ketika melawat","Buah yang ditanam sendiri"],"answer":1,"explain":"Buah tangan ialah hadiah yang dibawa ketika melawat seseorang."},{"q":"Apakah tindakan yang menunjukkan sikap ambil berat?","options":["Mengabaikan jiran yang sakit","Menunggu jiran meminta bantuan sahaja","Menziarahi jiran dan membawakan makanan"],"answer":2,"explain":"Menziarahi jiran dan membawakan makanan menunjukkan perhatian terhadap keadaannya."}]},

uarga Mak Cik Salmah walaupun mereka tidak dapat hadir."},{"q":"Bagaimanakah perasaan Farid apabila Amir datang?","options":["Kecewa dan marah","Gembira menerima kunjungan Amir","Takut untuk menyambut tetamu"],"answer":1,"explain":"Farid berbesar hati, iaitu gembira menerima kunjungan Amir."}]},

function playExample(line=null){
 if(speaking){stopAudio();return}
 const synth=window.speechSynthesis;
 stopAudio();const token=audioSession;let index=line===null?0:line;const end=line===null?mode.dialog.length:index+1;
 const voices=synth?.getVoices()||[],voice=voices.find(v=>v.lang.toLowerCase()==='ms-my')||voices.find(v=>v.lang.toLowerCase().startsWith('ms'));
 speaking=true;
 function fail(){if(token!==audioSession)return;recordedExample=null;speaking=false;audioText='Suara contoh tidak dapat dimainkan. Tekan dengar untuk mencuba semula.';updateReadingUI()}
 function next(){
  if(token!==audioSession||page!=='read')return;
  if(index>=end){recordedExample=null;speaking=false;audioText='Contoh bacaan selesai.';updateReadingUI();return}
  const i=index++;
  audioText=`Sedang memainkan contoh: baris ${i+1} / ${mode.dialog.length} · ${mode.dialog[i][0]}`;updateReadingUI();
  const clip=mode.id==='pink'?(pinkMotherAudio[i]||pinkAliAudio[i]):mode.id==='blue'?(blueAinaAudio[i]||blueMotherAudio[i]):null;
  if(clip){const player=new Audio(clip);recordedExample=player;player.onended=()=>{if(token!==audioSession)return;recordedExample=null;next()};player.onerror=fail;player.play().catch(fail);return}
  if(!synth||!window.SpeechSynthesisUtterance){fail();return}
  const u=new SpeechSynthesisUtterance(mode.dialog[i][1]);u.lang='ms-MY';u.rate=.8;u.pitch=1;if(voice)u.voice=voice;u.onend=next;u.onerror=fail;synth.speak(u);
 }next();
}
function updateReadingUI(){
 if(page!=='read'||!mode)return;
 const phase=reading.state.phase,busy=['starting','listening','checking'].includes(phase),complete=verified.size===mode.dialog.length;
 if(by('recordDialog')){by('recordDialog').disabled=complete||phase==='starting'||phase==='checking';by('recordDialog').textContent=complete?'✓ Semua baris disemak':phase==='starting'?'⏳ Membuka mikrofon…':phase==='listening'?'⏹ Henti & semak':phase==='checking'?'⏳ Menyemak…':'🎙️ Baca & Semak Dialog';by('recordDialog').setAttribute('aria-pressed',String(busy))}
 if(by('listenDialog')){by('listenDialog').disabled=busy;by('listenDialog').textContent=speaking?'⏹ Henti contoh bacaan':'🔊 Dengar Contoh Bacaan'}
 if(by('goVocab'))by('goVocab').disabled=!complete;
 if(by('readCount'))by('readCount').textContent=`${verified.size} / ${mode.dialog.length} baris disemak`;
 if(by('readTarget'))by('readTarget').textContent=complete?'Bacaan dialog selesai.':`Giliran membaca: baris ${activeLine+1} · ${mode.dialog[activeLine][0]}`;
 if(by('progressFill'))by('progressFill').style.width=(verified.size/mode.dialog.length*100)+'%';
 if(by('readMessage'))by('readMessage').textContent=lastMessage||'Dengar contoh. Kemudian, tekan mikrofon dan baca baris pertama.';
 if(by('toolbarState'))by('toolbarState').textContent=lastMessage||'Tekan mikrofon dan baca baris yang bertanda Giliran kamu.';
 if(by('readHeard'))by('readHeard').textContent=lastHeard?'Yang didengar: “'+lastHeard+'”':'';
 if(by('readFeedback'))by('readFeedback').dataset.phase=lastPhase;
 if(by('audioInfo'))by('audioInfo').textContent=audioText;
 document.querySelectorAll('[data-line]').forEach(el=>{const i=Number(el.dataset.line);el.classList.toggle('done',verified.has(i));el.classList.toggle('current',i===activeLine);const status=el.querySelector('.line-status');if(status)status.textContent=verified.has(i)?'✓ Disemak':i===activeLine?'Giliran kamu':'Baris '+(i+1)});
 document.querySelectorAll('[data-listen]').forEach(el=>el.disabled=busy);
}
function record(){
 if(page!=='read'||!mode||activeLine<0)return;
 if(reading.state.phase==='listening'){recStop?.();return}
 if(['starting','checking'].includes(reading.state.phase))return;
 stopAudio();recordLine=activeLine;
 recStop=reading.start(mode.dialog[recordLine][1]);

function selection(){return `<div class="heading"><div><span class="eyebrow">Pilih teman pengembaraan</span><h1>Obor-obor mana pilihan kamu?</h1><p>Empat tahap bacaan. Pilih satu yang sesuai untuk kamu.</p></div></div>${breadcrumbs(0)}<div class="mode-grid">${MODES.map((m,i)=>`<button class="mode-card" style="--mode:${m.color}" data-mode="${m.id}" aria-label="Pilih mod ${m.label}: ${m.title}"><div class="jelly-box">${jelly(m.color,.85+i*.09)}</div><small>MOD ${i+1} · ${m.level}</small><h2>${m.label}</h2><p>${m.title}</p><span class="count">${m.dialog.length} baris · ${m.idioms.length} simpulan bahasa</span><span class="choose">Pilih ${m.label} →</span></button>`).join('')}</div><p class="footnote">Tidak perlu melengkapkan semua mod. Satu pilihan, satu pengembaraan!</p>`}
function readingPage(){return `<button class="page-back" id="backModes">← Pilih mod lain</button>${breadcrumbs(1)}<article class="paper"><div class="paper-head"><span class="eyebrow">MOD ${mode.label.toUpperCase()} · BACAAN DIALOG</span><h1>${mode.title}</h1><div class="cast">${Object.entries(mode.cast).map(([name,role])=>`<div class="cast-chip">${avatar(name)}<span><strong>${esc(name)}</strong><small>${esc(role)}</small></span></div>`).join('')}</div><p class="reading-note">📖 Baca <strong>ayat dialog sahaja</strong>, tanpa menyebut nama watak. Semak satu baris pada satu masa. Seluruh dialog boleh dibaca dengan skrol ke bawah.</p><div class="toolbar"><div class="toolbar-row"><div class="read-counter"><strong id="readCount"></strong><small id="readTarget"></small></div><div class="actions"><button class="btn small" id="listenDialog">🔊 Dengar Contoh Bacaan</button><button class="btn pink small" id="recordDialog" aria-pressed="false">🎙️ Baca & Semak Dialog</button></div></div><div class="read-progress" aria-label="Kemajuan bacaan"><i id="progressFill"></i></div><p class="toolbar-state" id="toolbarState" role="status" aria-live="polite"></p><p class="audio-info" id="audioInfo"></p></div><div class="dialog-list">${mode.dialog.map(([name,text],i)=>`<div class="turn" data-line="${i}">${avatar(name)}<div class="speech-bubble"><div class="speaker">${esc(name)}<span class="line-status">Baris ${i+1}</span></div><p>${highlighted(text)}</p><button class="line-listen" data-listen="${i}" aria-label="Dengar baris ${i+1}, ${esc(name)}">🔊 Dengar baris ini</button></div></div>`).join('')}</div><div class="read-feedback" id="readFeedback"><strong id="readMessage"></strong><p class="heard" id="readHeard"></p></div><div class="foot-actions"><button class="btn light small" id="findLine">↑ Pergi ke baris bacaan</button><button class="btn gold" id="goVocab" disabled>💡 Lihat Simpulan Bahasa dan Maksud →</button></div><details class="teacher-help"><summary>Panduan guru dan mikrofon</summary><p>Benarkan mikrofon dan buka pautan terus dalam Chrome dengan Internet. Tekan mikrofon semula untuk baris seterusnya selepas bacaan sepadan. Jika bacaan belum sepadan, dengar contoh dan cuba lagi. Semakan ini membandingkan perkataan yang dikesan; sebutan dan intonasi masih memerlukan penilaian guru. Audio diproses oleh perkhidmatan suara pelayar. Halaman ini tidak menyimpan fail rakaman. Suara Ali dan ibu dalam mod merah jambu serta Aina dan ibu dalam mod biru menggunakan audio yang disediakan oleh guru. Suara watak lain bergantung pada suara Bahasa Melayu yang tersedia pada peranti.</p></details></article>`}
function vocabPage(){return `${breadcrumbs(2)}<article class="paper"><div class="paper-head"><span class="eyebrow">MOD ${mode.label.toUpperCase()} · KENALI MAKSUD</span><h1>Oh, itu maksudnya!</h1><p>Mari fahami simpulan bahasa dalam dialog tadi.</p></div><div class="vocab-body">${mode.idioms.map(([term,meaning],i)=>{const line=mode.dialog.find(([,t])=>norm(t).includes(norm(term)));return `<div class="idiom-card"><span class="idiom-number">${i+1}</span><div><h2>${esc(term)}</h2><p>${esc(meaning)}</p>${line?`<p class="quote">Dalam dialog: “${esc(line[1])}”</p>`:''}</div></div>`}).join('')}</div><div class="foot-actions"><button class="btn light" id="backRead">← Baca semula dialog</button><button class="btn gold" id="beginQuiz">Teruskan ke Latihan Pemahaman →</button></div></article>`}
function quizPage(){const q=mode.questions[question];return `${breadcrumbs(3)}<article class="paper"><div class="paper-head"><span class="eyebrow">MOD ${mode.label.toUpperCase()} · LATIHAN PEMAHAMAN</span><h1>${mode.title}</h1></div><div class="quiz-body"><div class="q-count"><span>SOALAN ${question+1} DARIPADA 4</span><span class="dots" aria-label="Kemajuan soalan">${mode.questions.map((_,i)=>`<i class="${i<question?'done':i===question?'now':''}"></i>`).join('')}</span></div><h2 class="question">${esc(q.q)}</h2><div class="choices">${q.options.map((o,i)=>`<button class="answer ${chosen===i?(quizSolved?'correct':'wrong'):''}" data-answer="${i}" ${quizSolved?'disabled':''}><b>${'ABC'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>${feedback?`<div class="quiz-feedback ${quizSolved?'':'retry'}" role="status">${esc(feedback)}</div>`:''}</div><div class="foot-actions"><button class="btn light small" id="reviewDialog">📖 Rujuk dialog</button>${quizSolved?`<button class="btn gold" id="nextQuestion">${question===3?'Selesaikan Misi ⭐':'Soalan seterusnya →'}</button>`:'<span class="muted">Pilih jawapan yang paling tepat.</span>'}</div></article>`}
function resultPage(){return `<section class="result"><span class="eyebrow">MISI 5 · MOD ${mode.label.toUpperCase()}</span><div class="reward">⭐</div><h1>Hebat, pembaca cilik!</h1><p>Kamu berjaya membaca dialog <strong>${mode.title}</strong>, mengenali simpulan bahasa dan menyelesaikan empat soalan pemahaman.</p><div class="stats"><div class="stat"><strong>${mode.dialog.length}/${mode.dialog.length}</strong><small>Baris bacaan disemak</small></div><div class="stat"><strong>4/4</strong><small>Soalan diselesaikan</small></div><div class="stat"><strong>${mode.idioms.length}</strong><small>Simpulan bahasa dipelajari</small></div></div><div class="actions"><a class="btn gold" href="./">🗺️ Kembali ke Peta</a><button class="btn light" id="playAgain">Main Semula</button></div><p class="muted">${embedded?'Bintang Misi 5 telah dikumpulkan pada peta pengembaraan kamu.':'Ganjaran halaman percubaan ini disimpan berasingan daripada game utama.'}</p></section>`}
function render(){document.documentElement.style.setProperty('--mode',mode?.color||'#f282be');app.innerHTML=page==='intro'?intro():page==='modes'?selection():page==='read'?readingPage():page==='vocab'?vocabPage():page==='quiz'?quizPage():resultPage();bind();if(page==='read'){
 updateReadingUI();
 if(reviewReturn==='quiz'){const b=by('goVocab');b.disabled=false;b.textContent='Kembali ke Soalan →';b.onclick=()=>{reviewReturn=null;go('quiz')}}
}}
function bind(){
 if(by('chooseMode'))by('chooseMode').onclick=()=>go('modes');
 document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=MODES.find(m=>m.id===b.dataset.mode);verified=new Set();activeLine=0;question=0;chosen=null;feedback='';quizSolved=false;lastMessage='';lastHeard='';lastPhase='idle';reviewReturn=null;go('read')});
 if(by('backModes'))by('backModes').onclick=()=>{reviewReturn=null;go('modes')};
 if(by('listenDialog'))by('listenDialog').onclick=()=>playExample();
 if(by('recordDialog'))by('recordDialog').onclick=record;
 document.querySelectorAll('[data-listen]').forEach(b=>b.onclick=()=>playExample(Number(b.dataset.listen)));
 if(by('findLine'))by('findLine').onclick=()=>document.querySelector(`[data-line="${Math.max(activeLine,0)}"]`)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});
 if(by('goVocab'))by('goVocab').onclick=()=>{if(verified.size===mode.dialog.length)go('vocab')};
 if(by('backRead'))by('backRead').onclick=()=>go('read');
 if(by('beginQuiz'))by('beginQuiz').onclick=()=>{if(verified.size!==mode.dialog.length)return;question=0;chosen=null;feedback='';quizSolved=false;go('quiz')};
 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(quizSolved)return;const q=mode.questions[question];chosen=Number(b.dataset.answer);quizSolved=chosen===q.answer;feedback=quizSolved?'✓ Betul! '+q.explain:'Belum tepat. Rujuk dialog dan cuba sekali lagi.';const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'})});
 if(by('reviewDialog'))by('reviewDialog').onclick=()=>{reviewReturn='quiz';go('read')};
 if(by('nextQuestion'))by('nextQuestion').onclick=()=>{if(!quizSolved)return;if(question===3){try{localStorage.setItem('sibaca-misi5-preview-'+mode.id,JSON.stringify({completed:true,date:new Date().toISOString()}))}catch(_){}notify('completed');go('result')}else{question++;chosen=null;feedback='';quizSolved=false;go('quiz')}};
 if(by('playAgain'))by('playAgain').onclick=()=>go('modes');
}
document.addEventListener('click',event=>{const link=event.target.closest('a');if(!embedded||!link)return;const href=link.getAttribute('href');if(href==='./'){event.preventDefault();stopAll();notify('close')}else if(href==='misi5-percubaan.html'){event.preventDefault();go('intro')}});
window.addEventListener('pagehide',stopAll);document.addEventListener('visibilitychange',()=>{if(document.hidden){stopAll();if(page==='read'){lastMessage='Bacaan dijeda. Tekan mikrofon apabila kamu bersedia.';lastPhase='idle';updateReadingUI()}}});
render();
})();

</script></body></html>
